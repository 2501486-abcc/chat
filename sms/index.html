<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>SMS Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
  <!-- Sidebar (copied from Home Screen) -->
  <nav class="sidebar collapsed" id="sidebar">
    <button class="toggle-btn" id="toggle-btn" aria-label="Toggle Sidebar" aria-expanded="false">
      <span class="icon"><i class="fa-solid fa-bars"></i></span>
      <span class="text" data-i18n="menu">Menu</span>
    </button>
    <ul class="nav">
      <li>
        <a class="nav-link" href="../home screen/index.html">
          <span class="icon"><i class="fa-solid fa-house"></i></span>
          <span class="text" data-i18n="nav_home">Home</span>
        </a>
      </li>
      <li><span class="icon"><i class="fa-solid fa-comment-dots"></i></span> <span class="text" data-i18n="nav_messaging">Messaging</span></li>
      <li>
        <a class="nav-link" href="../simulation/index.html">
          <span class="icon"><i class="fa-solid fa-chart-line"></i></span>
          <span class="text" data-i18n="nav_connection">Connection</span>
        </a>
      </li>
    </ul>

    <div class="lang-switch" role="group" aria-label="Language">
      <button class="lang-btn" type="button" data-lang="en" aria-pressed="false">
        <span class="icon" aria-hidden="true">🇺🇸</span>
        <span class="text" data-i18n="lang_english">English</span>
      </button>
      <button class="lang-btn" type="button" data-lang="ja" aria-pressed="false">
        <span class="icon" aria-hidden="true">🇯🇵</span>
        <span class="text" data-i18n="lang_japanese">日本語</span>
      </button>
    </div>
  </nav>

  <main class="main">
    <div class="chat-container">
      <h2 data-i18n="sms_title">1対1 匿名チャット</h2>
      <div id="chatStatus" class="chat-status" role="status" aria-live="polite">Waiting…</div>
      <div id="chatTimer" class="chat-timer" aria-live="polite"></div>

      <ul id="log"></ul>

      <div class="input-area">
        <input id="msg" data-i18n-placeholder="sms_placeholder" placeholder="メッセージを入力">
        <button onclick="send()" data-i18n="sms_send">送信</button>
      </div>
    </div>

    <div id="rematchModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="rematchTitle">
      <div class="modal-card">
        <h3 id="rematchTitle" data-i18n="rematch_title">New person is waiting</h3>
        <p id="rematchBody" class="muted" data-i18n="rematch_body">Do you want to keep chatting with your current partner, or match with someone else?</p>
        <div class="modal-actions">
          <button id="rematchKeep" type="button" class="btn-secondary" data-i18n="rematch_keep">Keep chatting</button>
          <button id="rematchSwitch" type="button" class="btn" data-i18n="rematch_match">Match someone else</button>
        </div>
      </div>
    </div>
  </main>
    <script src="script.js"></script>
  </body>
</html>
